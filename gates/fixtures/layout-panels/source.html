<!doctype html><html class="graphite"><meta charset="utf-8"><style>
* { box-sizing:border-box; border:0 solid #e5e7eb; }
html { font:400 16px/1.5 WebPlex; color:#fff; }
body { margin:0; } button,input { font:inherit; color:inherit; background:transparent; padding:0; margin:0; }
p,h3 { margin:0; } svg { display:block; flex-shrink:0; }
.panel { position:fixed; right:0; top:0; width:420px; height:100svh; background:#1a1d21; border-left:1px solid #3a3f47; display:flex; }
.inner { flex:1; min-width:0; border-left:1px solid #434343; display:flex; flex-direction:column; }
.header { height:48px; flex-shrink:0; padding:16px 8px 0; display:flex; align-items:center; justify-content:space-between; gap:16px; font-size:14px; font-weight:700; }
.title { display:flex; align-items:center; gap:4px; padding:2px 4px; border-radius:4px; font-weight:500; }
.header-actions { display:flex; align-items:center; gap:8px; color:#8e9093; }
.transcript { flex:1; min-height:0; overflow:auto; }
.welcome { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px 40px; }
.suggestions { display:flex; flex-direction:column; gap:8px; width:100%; max-width:448px; }
.suggestion { width:100%; padding:8px; background:#363b44; border-radius:4px; font-size:12px; text-align:left; }
.composer-outer { padding:8px; }
.composer { display:flex; flex-direction:column; align-items:center; padding:8px; border-radius:8px; background:#262a30; }
.input { width:100%; font-size:14px; line-height:21px; padding:8px 0; max-height:380px; }
.controls { width:100%; padding-top:8px; display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; }
.scope { font-size:13px; line-height:1.5; }
.messages { padding:8px; }
.message { display:flex; flex-direction:column; font-size:12px; min-width:0; margin-bottom:8px; }
.human { align-items:flex-end; }
.bubble { padding:4px 8px; border-radius:4px; width:100%; }
.human .bubble { background:#262a30; width:auto; }
.content { font-size:14px; line-height:1.5; }
.content p { margin-bottom:8px; }
.actions { margin-top:2px; height:18px; opacity:0; }
.shortcuts { position:fixed; right:0; top:0; width:26vw; height:100svh; background:#141518; overflow:auto; font-size:14px; }
.search { width:100%; font-size:24px; line-height:21.74px; font-weight:500; padding:16px 16px 0; }
.shortcut-content { padding:0 16px; }
.group { margin-top:40px; margin-bottom:12px; color:#8e9093; font-size:14px; line-height:21px; font-weight:500; }
.shortcut { display:flex; align-items:center; margin-bottom:8px; gap:8px; }
.label { width:60%; font-size:14px; line-height:16.94px; font-weight:400; }
.keys { display:flex; gap:4px; width:40%; }
kbd { font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace; padding:4px 6px; margin:0 1.5px; border-radius:2px; background:#4f5765; min-height:25px; font-size:12px; line-height:18px; font-weight:400; }
</style><body></body></html>
