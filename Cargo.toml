[workspace]
resolver = "2"
members = ["crates/*", "vendor/gpui_windows", "vendor/gpui_wgpu"]
exclude = ["vendor/gpui"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"

[profile.release]
opt-level = "s"
lto = "fat"
panic = "abort"
codegen-units = 1
strip = true

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "vendor/gpui" }
gpui_windows = { path = "vendor/gpui_windows" }
gpui_wgpu = { path = "vendor/gpui_wgpu" }
