[package]
name = "ht-updater"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
url = "2"

[dev-dependencies]
tempfile = "3"
