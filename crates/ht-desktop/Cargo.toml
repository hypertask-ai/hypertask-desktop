[package]
name = "ht-desktop"
edition.workspace = true
version.workspace = true

[features]
default = ["visible-board-columns", "lazy-theme-fonts", "ht-core/bounded-sync-cache", "ht-core/compact-task-reads"]
lazy-theme-fonts = []
visible-board-columns = []

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "784e431c42c5c6ef2f10da9b20503a5e8f506df9", features = ["profiler"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "784e431c42c5c6ef2f10da9b20503a5e8f506df9", features = ["x11", "wayland"] }
ht-core = { path = "../ht-core" }
anyhow = "1"
chrono = "0.4"
iana-time-zone = "0.1"
dirs = "6"
serde_json = "1"
serde = "1"
unicode-segmentation = "1"
scraper = "0.24"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
open = "5"

ego-tree = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_HiDpi"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies.keyring]
version = "3"
default-features = false
features = ["windows-native"]

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "784e431c42c5c6ef2f10da9b20503a5e8f506df9", features = ["test-support"] }
