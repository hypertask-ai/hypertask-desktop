name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          # The Azure mirror stalls large Vulkan downloads on hosted runners.
          sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libxkbcommon-dev libvulkan-dev libssl-dev libzstd-dev clang cmake xvfb xauth mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
      - name: Upload Rust AI request fixture
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ai-live-request
          path: target/ai-live-request.json
          if-no-files-found: error
      - run: cargo build --release -p ht-desktop -p ht-core
      - name: Layout dump contract
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1440x900x24' python3 gates/layout-dump.py
      - name: Upload layout dumps
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-dumps
          path: evidence/layout/*.json
      - name: Windows memory (three runs per screen)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./gates/windows-memory.ps1
          -Exe target/release/ht-desktop.exe
          -CoreExe target/release/ht-core-cli.exe
          -Fixtures fixtures/demo
          -Revision '${{ github.event.pull_request.head.sha || github.sha }}'
          -Out evidence/windows-memory
      - name: Validate Windows memory receipt
        if: runner.os == 'Windows'
        run: python gates/windows-memory-check.py evidence/windows-memory
      - name: Upload Windows memory
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-memory
          path: evidence/windows-memory/
          if-no-files-found: error
      - name: Upload Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hypertask-desktop-windows
          path: target/release/ht-desktop.exe
          retention-days: 14
      - name: Upload Linux app
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: hypertask-desktop-linux
          path: target/release/ht-desktop
          retention-days: 14
      - name: Upload Mac app (Apple Silicon)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: hypertask-desktop-mac-arm64
          path: target/release/ht-desktop
          retention-days: 14
  windows-arm64:
    name: windows-arm64
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p ht-desktop --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: hypertask-desktop-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/ht-desktop.exe
          retention-days: 14
  windows-memory-baselines:
    name: memory-${{ matrix.revision }}
    if: github.event_name == 'pull_request' && github.head_ref == 'ram2'
    strategy:
      fail-fast: false
      matrix:
        revision: ['3d002231efdbc5ea4b823e5a1af430e912a168d9', '5016a9ebe48b03dbac2f2312c170878166586c59']
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current measurement script
        shell: pwsh
        run: Copy-Item gates/windows-memory.ps1 "$env:RUNNER_TEMP/windows-memory.ps1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p ht-desktop -p ht-core
      - name: Measure historical release
        shell: pwsh
        run: >-
          & "$env:RUNNER_TEMP/windows-memory.ps1"
          -Exe target/release/ht-desktop.exe
          -CoreExe target/release/ht-core-cli.exe
          -Fixtures fixtures/demo
          -Revision '${{ matrix.revision }}'
          -Out evidence/windows-memory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-memory-${{ matrix.revision }}
          path: evidence/windows-memory/
          if-no-files-found: error
  windows-memory-proof:
    name: Windows memory receipt and visual proof
    if: github.event_name == 'pull_request' && github.head_ref == 'ram2'
    needs: [build, windows-memory-baselines]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-memory*
          path: evidence/memory-proof
      - run: python3 -m pip install Pillow
      - name: Validate historical and fixed receipts; compare PR 11 pixels
        run: |
          python3 gates/windows-memory-check.py evidence/memory-proof/windows-memory-3d002231efdbc5ea4b823e5a1af430e912a168d9
          python3 gates/windows-memory-check.py evidence/memory-proof/windows-memory --target --compare evidence/memory-proof/windows-memory-5016a9ebe48b03dbac2f2312c170878166586c59
