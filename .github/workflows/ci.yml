name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      qa_comment_id:
        description: QA-only temporary contract comment ID
        default: "7"
        type: string
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # Release packages these binaries and uses this source CI run number in its tag.
  HT_RELEASE_BUILD_NUMBER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_number || '' }}
jobs:
  updater:
    name: updater-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --release -p ht-updater -- --nocapture
      - run: python gates/updater-release-tests.py
  pstack:
    name: Pstack contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Integrity and verification regressions
        run: |
          mkdir -p evidence/pstack
          set -o pipefail
          python3 gates/pstack-check.py | tee evidence/pstack/integrity.txt
          python3 gates/pstack-regressions.py 2>&1 | tee evidence/pstack/regressions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pstack-contract
          path: evidence/pstack/
          if-no-files-found: error
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          # The Azure mirror stalls large Vulkan downloads on hosted runners.
          sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libxkbcommon-dev libvulkan-dev libssl-dev libzstd-dev clang cmake xvfb xauth mesa-vulkan-drivers xdotool imagemagick
      - name: Prepare web font faces (CI only)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install fonttools==4.60.1 brotli==1.1.0
          python3 gates/layout-font-assets.py
          python3 gates/layout-font-freetype.py
      - name: Upload web font faces
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: web-source-fonts
          path: evidence/web-fonts/
          if-no-files-found: error
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prove compile-time release build number
        if: runner.os == 'Linux'
        env:
          HT_RELEASE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p evidence/version
          set -o pipefail
          cargo test --release -p ht-desktop version_tests -- --nocapture 2>&1 | tee evidence/version/build-number.txt
      - name: Upload version build proof
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: version-build
          path: evidence/version/
          if-no-files-found: error
      - run: cargo test --workspace --release
        env:
          HT_QA_COMMENT_ID: ${{ inputs.qa_comment_id || '7' }}
      - name: Upload Rust AI request fixture
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-live-request
          path: |
            target/ai-live-request.json
            target/compose-live-requests.json
          if-no-files-found: error
      - run: cargo build --release -p ht-desktop -p ht-core
      - name: Hosted Windows interaction dependencies
        if: runner.os == 'Windows'
        run: python -m pip install Pillow==11.3.0
      - name: Native Windows interactions
        if: runner.os == 'Windows'
        run: python gates/windows-input.py
        env:
          HT_VERIFY_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Layout dump contract
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1920x1009x24' python3 gates/layout-dump.py
      - name: Reference-content whole-box evidence
        if: runner.os == 'Linux'
        run: python3 gates/layout-reference.py
      - name: Additional web-source rail evidence
        if: runner.os == 'Linux'
        run: python3 gates/layout-rail.py
      - name: Native web-font advance regression
        if: runner.os == 'Linux'
        run: cargo test --release -p gpui_wgpu --lib cosmic_text_system::tests
      - name: Dependency lock contract
        if: runner.os == 'Linux'
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22
      - name: Browser typography dependencies
        if: runner.os == 'Linux'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Complete source-backed rail collection
        if: runner.os == 'Linux'
        run: node gates/layout-rail-collector.mjs
      - name: Graphite AI and shortcut sheet measurements
        if: runner.os == 'Linux'
        run: node gates/layout-panels.mjs
      - name: Native inbox keyboard archive
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1440x900x24' python3 gates/desktop-input.py
        env:
          HT_VERIFY_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload native input evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-input
          path: evidence/desktop-input/
          if-no-files-found: error
      - name: Web-source typography contract
        if: runner.os == 'Linux'
        run: node gates/layout-fonts.mjs
      - name: Upload layout dumps
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-dumps
          path: |
            evidence/layout/**/*.json
            evidence/layout/**/*.txt
          if-no-files-found: error
      - name: Windows memory (three runs per screen)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./gates/windows-memory.ps1
          -Exe target/release/ht-desktop.exe
          -CoreExe target/release/ht-core-cli.exe
          -Fixtures fixtures/demo
          -Revision '${{ github.event.pull_request.head.sha || github.sha }}'
          -Out evidence/windows-memory
          -StartupProof
      - name: Validate Windows memory receipt
        if: runner.os == 'Windows'
        run: python gates/windows-memory-check.py evidence/windows-memory --owners --budget gates/windows-memory-budget.json
      - name: Upload Windows memory
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-memory
          path: evidence/windows-memory/
          if-no-files-found: error
      - name: Generate heavy account
        if: runner.os == 'Windows'
        run: python gates/heavy-fixture.py evidence/heavy-fixtures
      - name: Heavy account Windows memory (three runs per screen)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./gates/windows-memory.ps1
          -Exe target/release/ht-desktop.exe
          -CoreExe target/release/ht-core-cli.exe
          -Fixtures evidence/heavy-fixtures
          -HeavyManifest evidence/heavy-manifest.json
          -AiHistory evidence/heavy-ai-history.json
          -Assets evidence/heavy-assets
          -Revision '${{ github.event.pull_request.head.sha || github.sha }}'
          -Out evidence/windows-memory-heavy
          -StartupProof
      - name: Validate heavy account receipt
        if: runner.os == 'Windows'
        run: python gates/heavy-memory-check.py evidence/windows-memory-heavy --budget gates/windows-memory-heavy-budget.json
      - name: Upload heavy Windows memory
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-memory-heavy
          path: evidence/windows-memory-heavy/
          if-no-files-found: error
      - name: Upload Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hypertask-desktop-windows
          path: target/release/ht-desktop.exe
          retention-days: 14
      - name: Upload Linux app
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: hypertask-desktop-linux
          path: target/release/ht-desktop
          retention-days: 14
      - name: Upload Mac app (Apple Silicon)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: hypertask-desktop-mac-arm64
          path: target/release/ht-desktop
          retention-days: 14
      - name: Native Windows missing-effect controls and restored proof
        if: runner.os == 'Windows'
        run: python gates/windows-input-negative.py
        env:
          HT_VERIFY_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload native Windows input evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-input
          path: evidence/windows-input/
          if-no-files-found: error
      - name: Opt-in input benchmark smoke
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p ht-desktop --features input-benchmark
          db_dir=$(mktemp -d)
          target/release/ht-core-cli --db "$db_dir/local.db" import-fixtures fixtures/demo
          set -o pipefail
          xvfb-run -a -s '-screen 0 1440x900x24' target/release/ht-desktop --db "$db_dir/local.db" --offline --screen inbox --bench-input 4 | tee "$db_dir/benchmark.txt"
          grep 'INPUT_TO_FRAME n=4 ' "$db_dir/benchmark.txt"
  windows-arm64:
    name: windows-arm64
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p ht-desktop --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: hypertask-desktop-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/ht-desktop.exe
          retention-days: 14
  windows-memory-baselines:
    outputs:
      demo-artifact: ${{ steps.control-identity.outputs.demo-artifact }}
    name: memory-${{ github.head_ref == 'mem6' && 'oversized-layout-storage' || github.head_ref == 'mem5' && 'retained-inbox-metadata-profiler-mapped-buffers' || github.head_ref == 'mem3' && 'heavy-full-task-reads' || github.head_ref == 'mem2' && 'eager-fonts-triple-buffer' || matrix.revision }}
    if: github.event_name == 'pull_request' && contains(fromJSON('["ram2","mem2","mem3","mem5","mem6"]'), github.head_ref)
    strategy:
      fail-fast: false
      matrix:
        revision: ${{ fromJSON(contains(fromJSON('["mem2","mem3","mem5","mem6"]'), github.head_ref) && format('["{0}"]', github.event.pull_request.head.sha) || '["3d002231efdbc5ea4b823e5a1af430e912a168d9", "5016a9ebe48b03dbac2f2312c170878166586c59"]') }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current measurement script
        shell: pwsh
        run: |
          Copy-Item gates/windows-memory.ps1 "$env:RUNNER_TEMP/windows-memory.ps1"
          Copy-Item gates/windows-memory-inspect.ps1 "$env:RUNNER_TEMP/windows-memory-inspect.ps1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p ht-desktop -p ht-core
        if: github.head_ref != 'mem2' && github.head_ref != 'mem3' && github.head_ref != 'mem5' && github.head_ref != 'mem6'
      - name: Build identical code with eager fonts, three buffers and the original sync cache
        if: github.head_ref == 'mem2'
        run: cargo build --release --no-default-features -p ht-desktop -p ht-core -p gpui_windows --features gpui_windows/triple-buffer
      - name: Build identical code with full task reads
        if: github.head_ref == 'mem3'
        run: cargo build --release --no-default-features -p ht-desktop -p ht-core --features ht-desktop/lazy-theme-fonts,ht-core/bounded-sync-cache
      - name: Build identical code retaining metadata, profiler and mapped buffers
        if: github.head_ref == 'mem5'
        run: cargo build --release --no-default-features -p ht-desktop -p ht-core -p gpui_windows --features ht-desktop/visible-board-columns,ht-desktop/lazy-theme-fonts,ht-desktop/input-benchmark,ht-core/bounded-sync-cache,ht-core/compact-task-reads,gpui_windows/mapped-instance-buffers
      - name: Build identical code retaining oversized line and notification storage
        if: github.head_ref == 'mem6'
        run: cargo build --release --no-default-features -p ht-desktop -p ht-core --features ht-desktop/visible-board-columns,ht-desktop/lazy-theme-fonts,ht-core/bounded-sync-cache,ht-core/compact-task-reads,ht-core/compact-inbox-metadata,gpui/legacy-layout-storage
      - name: Name the measured demo control
        id: control-identity
        if: github.head_ref != 'mem3'
        shell: pwsh
        run: '"demo-artifact=windows-memory-${{ matrix.revision }}" >> $env:GITHUB_OUTPUT'
      - name: Generate identical heavy account
        if: github.head_ref == 'mem3' || github.head_ref == 'mem5' || github.head_ref == 'mem6'
        run: python gates/heavy-fixture.py evidence/heavy-fixtures
      - name: Measure heavy comparison control
        if: github.head_ref == 'mem3' || github.head_ref == 'mem5' || github.head_ref == 'mem6'
        shell: pwsh
        run: >-
          ./gates/windows-memory.ps1
          -Exe target/release/ht-desktop.exe
          -CoreExe target/release/ht-core-cli.exe
          -Fixtures evidence/heavy-fixtures
          -HeavyManifest evidence/heavy-manifest.json
          -AiHistory evidence/heavy-ai-history.json
          -Assets evidence/heavy-assets
          -Revision '${{ matrix.revision }}'
          -Out evidence/windows-memory-heavy-baseline
          -StartupProof:('${{ github.head_ref }}' -in @('mem5', 'mem6'))
      - name: Validate heavy control
        if: github.head_ref == 'mem3' || github.head_ref == 'mem5' || github.head_ref == 'mem6'
        run: python gates/heavy-memory-check.py evidence/windows-memory-heavy-baseline
      - name: Upload heavy comparison control
        if: (github.head_ref == 'mem3' || github.head_ref == 'mem5' || github.head_ref == 'mem6') && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-memory-heavy-baseline
          path: evidence/windows-memory-heavy-baseline/
          if-no-files-found: error
      - name: Measure historical release
        if: github.head_ref != 'mem3'
        shell: pwsh
        run: >-
          & "$env:RUNNER_TEMP/windows-memory.ps1"
          -Exe target/release/ht-desktop.exe
          -CoreExe target/release/ht-core-cli.exe
          -Fixtures fixtures/demo
          -Revision '${{ matrix.revision }}'
          -Out evidence/windows-memory
          -StartupProof:('${{ github.head_ref }}' -in @('mem5', 'mem6'))
      - uses: actions/upload-artifact@v4
        if: github.head_ref != 'mem3' && always()
        with:
          name: ${{ steps.control-identity.outputs.demo-artifact }}
          path: evidence/windows-memory/
          if-no-files-found: error
  windows-memory-proof:
    name: Windows memory receipt and budget
    # Comparative baselines run for ram2/mem2/mem3/mem5/mem6; frozen budgets apply on every PR/main.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
      (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    needs: [build, windows-memory-baselines]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-memory*
          path: evidence/memory-proof
      - name: Validate current Windows receipt, target and frozen budget
        run: python3 gates/windows-memory-check.py evidence/memory-proof/windows-memory --owners --target --budget gates/windows-memory-budget.json
      - run: python3 -m pip install Pillow
        if: github.event_name == 'pull_request' && contains(fromJSON('["ram2","mem2","mem3","mem5","mem6"]'), github.head_ref)
      - name: Compare memory optimization pixels and layout
        if: github.event_name == 'pull_request' && github.head_ref == 'mem2'
        run: python3 gates/windows-memory-check.py evidence/memory-proof/windows-memory --owners --target --budget gates/windows-memory-budget.json --require-improvement --compare evidence/memory-proof/${{ needs.windows-memory-baselines.outputs.demo-artifact }}
      # PR 11 predates shipped UI additions; pixel identity is only the ram2 optimization contract.
      - name: Validate historical and fixed receipts; compare PR 11 pixels
        if: github.event_name == 'pull_request' && github.head_ref == 'ram2'
        run: |
          python3 gates/windows-memory-check.py evidence/memory-proof/windows-memory-3d002231efdbc5ea4b823e5a1af430e912a168d9
          python3 gates/windows-memory-check.py evidence/memory-proof/windows-memory --owners --target --budget gates/windows-memory-budget.json --compare evidence/memory-proof/windows-memory-5016a9ebe48b03dbac2f2312c170878166586c59
      - name: Validate heavy workload, owners and locked budget
        run: python3 gates/heavy-memory-check.py evidence/memory-proof/windows-memory-heavy --budget gates/windows-memory-heavy-budget.json
      - name: Compare heavy memory, pixels and layout against full-task reads
        if: github.event_name == 'pull_request' && github.head_ref == 'mem3'
        run: python3 gates/heavy-memory-check.py evidence/memory-proof/windows-memory-heavy --budget gates/windows-memory-heavy-budget.json --compare evidence/memory-proof/windows-memory-heavy-baseline
      - name: Compare allocation commit, working set, warm pixels and ownership
        if: github.event_name == 'pull_request' && github.head_ref == 'mem5'
        run: |
          python3 gates/mem5-proof.py evidence/memory-proof/windows-memory evidence/memory-proof/${{ needs.windows-memory-baselines.outputs.demo-artifact }}
          python3 gates/mem5-proof.py evidence/memory-proof/windows-memory-heavy evidence/memory-proof/windows-memory-heavy-baseline
      - name: Compare packed notification ownership, exact pixels and memory
        if: github.event_name == 'pull_request' && github.head_ref == 'mem6'
        run: |
          python3 gates/mem6-proof.py evidence/memory-proof/windows-memory evidence/memory-proof/${{ needs.windows-memory-baselines.outputs.demo-artifact }}
          python3 gates/mem6-proof.py evidence/memory-proof/windows-memory-heavy evidence/memory-proof/windows-memory-heavy-baseline
