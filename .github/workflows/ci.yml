name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libxkbcommon-dev libvulkan-dev libssl-dev libzstd-dev clang cmake xvfb xauth mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
      - name: Upload Rust AI request fixture
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ai-live-request
          path: target/ai-live-request.json
          if-no-files-found: error
      - run: cargo build --release -p ht-desktop -p ht-core
      - name: Layout dump contract
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1440x900x24' python3 gates/layout-dump.py
      - name: Upload layout dumps
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-dumps
          path: evidence/layout/*.json
      - name: Upload Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hypertask-desktop-windows
          path: target/release/ht-desktop.exe
          retention-days: 14
      - name: Upload Linux app
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: hypertask-desktop-linux
          path: target/release/ht-desktop
          retention-days: 14
      - name: Upload Mac app (Apple Silicon)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: hypertask-desktop-mac-arm64
          path: target/release/ht-desktop
          retention-days: 14
  windows-arm64:
    name: windows-arm64
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p ht-desktop --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: hypertask-desktop-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/ht-desktop.exe
          retention-days: 14
